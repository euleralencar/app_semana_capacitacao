{% extends "base.html" %}
{% block title %}Check-in · Semana da Capacitação 2026{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl">
  <h1 class="text-3xl font-bold">Check-in</h1>
  <p class="mt-2 text-slate-600">Informe seu CPF e o código da palestra.</p>
  {% if error %}<div class="mt-6 rounded-lg bg-yellow-50 p-4 text-yellow-900 ring-1 ring-yellow-200" role="alert">{{ error }}</div>{% endif %}
  {% if success %}<div class="mt-6 rounded-lg bg-emerald-50 p-4 text-emerald-800" role="status">{{ success }}</div>{% endif %}
  <form method="post" class="mt-6 space-y-5 rounded-xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
    <label class="block"><span class="text-sm font-medium">CPF</span><input required name="cpf" value="{{ form_data.cpf|default('') }}" maxlength="14" class="field" autocomplete="off" placeholder="000.000.000-00"></label>
    <label class="block"><span class="text-sm font-medium">Código da palestra</span><input required name="codigo_palestra" value="{{ form_data.codigo_palestra|default('') }}" maxlength="30" class="field" placeholder="100" autocomplete="off"></label>
    <button class="button" type="submit">Registrar check-in</button>
  </form>
</section>
{% endblock %}
